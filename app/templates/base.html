<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gift Panel{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-dark-gold text-gray-200">

    <nav class="nav-glass sticky top-0 z-40">
        <div class="container mx-auto px-4 flex items-center justify-between h-14">
            <div class="flex items-center gap-2 font-extrabold text-yellow-400 text-lg">🎁 Gift Panel</div>
            <div class="flex items-center gap-1 text-sm">
                <a href="/admin/" class="px-3 py-2 rounded-lg {{ 'bg-yellow-400/10 text-yellow-400 font-bold border border-yellow-400/30' if active_page == 'dashboard' else 'text-gray-400 hover:bg-white/5 hover:text-yellow-300' }}">📊 داشبورد</a>
                <a href="/admin/users" class="px-3 py-2 rounded-lg {{ 'bg-yellow-400/10 text-yellow-400 font-bold border border-yellow-400/30' if active_page == 'users' else 'text-gray-400 hover:bg-white/5 hover:text-yellow-300' }}">👥 کاربران</a>
                <a href="/admin/settings" class="px-3 py-2 rounded-lg {{ 'bg-yellow-400/10 text-yellow-400 font-bold border border-yellow-400/30' if active_page == 'settings' else 'text-gray-400 hover:bg-white/5 hover:text-yellow-300' }}">⚙️ تنظیمات</a>
                <a href="/admin/logout" class="px-3 py-2 rounded-lg text-gray-400 hover:bg-red-500/10 hover:text-red-400">🚪 خروج</a>
            </div>
        </div>
    </nav>

    {% if message %}
    <div class="fixed top-16 inset-x-0 z-50 flex justify-center px-4 pointer-events-none">
        <div id="serverToast" class="pointer-events-auto glass-card border-r-4 border-yellow-400 rounded-xl p-4 toast-enter flex items-center gap-3 w-full max-w-md">
            <div class="text-2xl">🔔</div>
            <p class="text-gray-200 text-sm flex-1">{{ message }}</p>
            <button onclick="hideToast(document.getElementById('serverToast'))" class="text-gray-500 hover:text-gray-300">✕</button>
        </div>
    </div>
    <script>setTimeout(() => hideToast(document.getElementById('serverToast')), 5000);</script>
    {% endif %}

    <div class="fixed bottom-6 inset-x-0 z-50 flex justify-center px-4 pointer-events-none">
        <div id="jsToast" class="hidden pointer-events-auto bg-gray-900 border border-yellow-400/30 text-gray-100 text-sm px-5 py-3 rounded-full shadow-2xl toast-enter"></div>
    </div>

    <!-- مودال تأیید اختصاصی پنل -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl w-full max-w-sm p-6 text-center">
            <div class="text-4xl mb-3">️</div>
            <h3 class="font-bold text-lg mb-2 text-white">مطمئن هستید؟</h3>
            <p id="confirmMsg" class="text-sm text-gray-400 mb-5"></p>
            <div class="flex gap-2">
                <button onclick="confirmYes()" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg">بله، انجام بده</button>
                <button onclick="closeModal('confirmModal')" class="flex-1 bg-white/10 hover:bg-white/15 text-gray-200 py-2 rounded-lg">انصراف</button>
            </div>
        </div>
    </div>

    <main class="container mx-auto p-4 md:p-8">
        {% block content %}{% endblock %}
    </main>

    <script>
        function hideToast(el){ if(!el) return; el.classList.remove('toast-enter'); el.classList.add('toast-exit'); setTimeout(()=>el.remove(),400); }
        function jsToast(msg){ const t=document.getElementById('jsToast'); t.textContent=msg; t.classList.remove('hidden'); t.classList.add('toast-enter'); clearTimeout(t._h); t._h=setTimeout(()=>{ t.classList.add('toast-exit'); setTimeout(()=>{ t.classList.add('hidden'); t.classList.remove('toast-exit'); },400); },2500); }
        function copyText(txt){ navigator.clipboard.writeText(txt).then(()=>jsToast('📋 کپی شد!')).catch(()=>{ const i=document.createElement('textarea'); i.value=txt; document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); jsToast('📋 کپی شد!'); }); }
        function closeModal(id){ document.getElementById(id).classList.add('hidden'); }

        let _confirmCb = null;
        function askConfirm(msg, cb){
            document.getElementById('confirmMsg').textContent = msg;
            _confirmCb = cb;
            document.getElementById('confirmModal').classList.remove('hidden');
        }
        function confirmYes(){
            closeModal('confirmModal');
            const cb = _confirmCb; _confirmCb = null;
            if (cb) cb();
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
