<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Gift Panel - داشبورد</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div class="container mx-auto p-8">
        <h1 class="text-3xl font-bold text-blue-600 mb-8">🎁 Gift Panel - مدیریت پنل</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- فرم افزودن کانفیگ -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-green-600">➕ افزودن کانفیگ دستی</h2>
                <form action="/admin/add-config" method="POST">
                    <textarea name="raw_text" rows="8" class="w-full p-2 border rounded mb-4" 
                              placeholder="لینک‌های کانفیگ را اینجا وارد کنید (هر خط یکی)...&#10;vless://...#🇺🇸 US Node&#10;vmess://...#🇩🇪 DE Frankfurt"></textarea>
                    <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">ذخیره کانفیگ‌ها</button>
                </form>
            </div>

            <!-- فرم افزودن کاربر -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-purple-600">👤 افزودن کاربر جدید</h2>
                <form action="/admin/add-user" method="POST">
                    <input type="text" name="username" placeholder="نام کاربری" class="w-full p-2 border rounded mb-4" required>
                    <input type="number" name="days" placeholder="مدت زمان (روز)" class="w-full p-2 border rounded mb-4" required>
                    <button type="submit" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">ساخت کاربر</button>
                </form>
            </div>
        </div>

        <!-- لیست کاربران و کانفیگ‌ها -->
        <div class="mt-8 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">📊 وضعیت فعلی</h2>
            <p class="mb-2">تعداد کاربران: <span class="font-bold text-blue-500">{{ users|length }}</span></p>
            <p>تعداد کانفیگ‌های ثبت شده: <span class="font-bold text-green-500">{{ configs|length }}</span></p>
            
            <div class="mt-4">
                <h3 class="font-semibold mb-2">آخرین کانفیگ‌های پردازش شده:</h3>
                <ul class="bg-gray-50 p-4 rounded max-h-40 overflow-y-auto text-sm font-mono">
                    {% for config in configs[-5:] %}
                        <li class="mb-1 text-gray-700">✅ {{ config.remark }}</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
