<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - Gift Panel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-dark-gold min-h-screen flex items-center justify-center p-4">

    <div class="relative w-full max-w-md">
        <!-- گوشه‌های تزئینی -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-br"></div>

        <div class="glass-card rounded-3xl p-8 md:p-10 text-center">
            <div class="icon-chip mx-auto mb-5">🔑</div>

            <h1 class="text-2xl md:text-3xl font-extrabold text-white mb-2">
                ورود به <span class="text-yellow-400">پنل</span>
            </h1>
            <p class="text-sm text-gray-400 mb-8">نام کاربری و رمز عبور خود را وارد کنید</p>

            {% if error %}
            <div class="error-glass mb-5 text-center">⚠️ {{ error }}</div>
            {% endif %}

            <form method="post" action="/admin/login" class="text-right">
                <label class="block text-xs text-gray-400 mb-2">نام کاربری</label>
                <input name="username" required autocomplete="username" placeholder="admin"
                       class="input-gold w-full p-3.5 mb-4 text-sm">

                <label class="block text-xs text-gray-400 mb-2">رمز عبور</label>
                <input name="password" type="password" required autocomplete="current-password" placeholder="••••••••"
                       class="input-gold w-full p-3.5 mb-7 text-sm">

                <button class="btn-gold w-full py-3.5 text-sm">
                    ورود به پنل ←
                </button>
            </form>

            <p class="text-[11px] text-gray-500 mt-7">🎁 Gift Panel — دسترسی بدون مجوز ممنوع</p>
        </div>
    </div>

</body>
</html>
