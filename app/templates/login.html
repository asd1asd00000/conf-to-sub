<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - Gift Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="text-5xl mb-2">🎁</div>
            <h1 class="text-2xl font-bold text-gray-800">Gift Panel</h1>
            <p class="text-gray-500 text-sm mt-1">ورود به پنل مدیریت</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 mb-4 text-sm text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <div class="bg-white rounded-xl shadow-lg p-6">
            <form method="post" action="/admin/login">
                <label class="block text-sm text-gray-600 mb-1">نام کاربری</label>
                <input name="username" required autocomplete="username"
                       class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">

                <label class="block text-sm text-gray-600 mb-1">رمز عبور</label>
                <input name="password" type="password" required autocomplete="current-password"
                       class="w-full p-3 border border-gray-300 rounded-lg mb-5 focus:ring-2 focus:ring-blue-500 focus:outline-none">

                <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold">
                    🔓 ورود
                </button>
            </form>
        </div>
        <p class="text-center text-xs text-gray-400 mt-4">دسترسی بدون مجوز ممنوع است.</p>
    </div>
</body>
</html>
